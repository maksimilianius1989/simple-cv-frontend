<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перегляд резюме</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/cv.css" />

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/cv.js"></script>
  </head>

  <body>
    <!--# include virtual="/parts/header/header.html"-->

    <div class="cv-page">
      <div class="cv-container cv-container-loading">
        <h2>Пошук резюме...</h2>
      </div>

      <div class="cv-container cv-container-not-found hidden">
        <h2>Резюме не знайдено або знято з публікації</h2>
      </div>

      <div class="cv-container cv-container-content hidden">
        <!-- LEFT: PREVIEW -->
        <div class="cv-preview">
          <iframe id="cv-iframe" frameborder="0"></iframe>
        </div>

        <!-- RIGHT: LETTER + ACTIONS -->
        <div class="cv-sidebar hidden">
          <a id="download-pdf" class="btn btn-primary" target="_blank">
            📄 Завантажити PDF
          </a>

          <div>
            <h3>Супровідний лист</h3>
            <p id="cv-letter" class="cv-letter"></p>
          </div>

          <!--# include virtual="/parts/feedback/feedback.html"-->
        </div>
      </div>
    </div>

    <!--# include virtual="/parts/footer/footer.html" -->
    <!--# include virtual="/parts/modal/modal.html" -->
    <!--# include virtual="/parts/alert-handler/alert-handler.html" -->
  </body>
</html>
