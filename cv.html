<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перегляд резюме</title>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/cv.css" />

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/cv.js"></script>

  </head>

  <body>
    <!--# include virtual="/parts/header/header.html"-->

    <div class="cv-page">
      <div class="cv-container">
        <!-- LEFT: PREVIEW -->
        <div class="cv-preview">
          <iframe id="cv-iframe" frameborder="0" ></iframe>
        </div>

        <!-- RIGHT: LETTER + ACTIONS -->
        <div class="cv-sidebar">
          <a id="download-pdf" class="btn btn-primary" target="_blank">
            📄 Завантажити PDF
          </a>

          <div>
            <h3>Супровідний лист</h3>
            <p id="cv-letter" class="cv-letter"></p>
          </div>

          <div class="feedback-section">
            <h3>Зворотній зв’язок</h3>

            <input id="feedback-email" type="email" name="email" placeholder="Ваш email" required></input>
            <textarea
              id="feedback-text"
              placeholder="Напишіть коментар або питання..."
              required
            ></textarea>

            <button id="send-feedback" class="btn btn-primary">Надіслати</button>

            <p id="feedback-status" class="feedback-status"></p>
          </div>

        </div>
      </div>
    </div>

    <!--# include virtual="/parts/footer/footer.html" -->
  </body>
</html>
