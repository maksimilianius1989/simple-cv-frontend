<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon.ico" />
    <title>Login | Simple CV Life</title>
    <link rel="stylesheet" href="/assets/css/login.css" />
    <script src="/assets/js/config.js"></script>
  </head>

  <body>
    <div class="page">
      <!-- LEFT SIDE -->
      <div class="left">
        <div class="logo">Simple CV Life</div>

        <div class="badge">✨ Вхід в акаунт</div>

        <h1>Вітаємо <span>знову!</span></h1>
        <p>
          Увійдіть у свій акаунт, щоб продовжити створювати професійні резюме.
        </p>

        <form class="form">
          <label>Email</label>
          <input type="email" id="email" placeholder="you@example.com" />

          <label>Пароль</label>
          <input type="password" id="password" placeholder="Введіть пароль" />

          <div class="row">
            <label class="checkbox">
              <input type="checkbox" />
              Запамʼятати мене
            </label>

            <a href="#" class="link">Забули пароль?</a>
          </div>

          <button class="btn" id="enter">Увійти</button>

          <div class="divider">або</div>

          <button class="btn-outline">Увійти через Telegram</button>

          <p class="bottom">Ще не маєте акаунту? <a href="#">Реєстрація</a></p>
        </form>
      </div>

      <!-- RIGHT SIDE -->
      <div class="right">
        <div class="card">
          <img src="/assets/img/team_logo_no_bg.png" />
          <div class="overlay">
            <h3>Simple CV Life</h3>
            <p>Резюме за хвилини</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.querySelector(".form");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        await login();
      });

      async function login() {
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          alert("Заповніть email і пароль");
          return;
        }

        try {
          const res = await fetch(
            `${APP_CONFIG.API_URL}/auth/login`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                email,
                password,
              }),
            },
          );

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            console.log(error);
            alert("Помилка логіну");
            return;
          }

          const data = await res.json();
          localStorage.setItem("accessToken", data.accessToken);

          window.location.href = "/dashboard.html";
        } catch (err) {
          console.log("Login error: ", err);
          alert("Сервер не доступний");
        }
      }
    </script>
  </body>
</html>
