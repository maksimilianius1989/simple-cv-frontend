<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої резюме</title>

    <link rel="stylesheet" href="/assets/css/main.css" />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <script src="/assets/js/config.js"></script>
  </head>
  <body>
    <div id="app-loader" class="container-preloader">
      <div class="loader-overlay">
        <div class="loader-content">
          <div class="loader-spinner"></div>

          <h2>Завантажуємо ваш контент...</h2>

          <p>Це займе всього кілька секунд</p>
        </div>
      </div>
    </div>

    <div class="container" id="container">
 
      <!-- ========================= -->
      <!-- МОЇ РЕЗЮМЕ -->
      <!-- ========================= -->

      <section class="resume-section">
        <div class="section-header">
          <h2>Мої резюме</h2>
        </div>

        <div class="resume-grid">
          <div class="resume-card">
            <div class="resume-preview"></div>

            <div class="resume-content">
              <h3>Project Manager</h3>
              <span>Оновлено 12.05.2024</span>
            </div>

            <div class="resume-actions">
              <button><i class="fa-solid fa-eye"></i></button>
              <button><i class="fa-solid fa-pen"></i></button>
              <button><i class="fa-solid fa-copy"></i></button>
              <button><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>

          <div class="resume-create">
            <i class="fa-solid fa-plus"></i>
            <h3>Створити нове резюме</h3>
          </div>
        </div>
      </section>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => checkAuth());

      async function checkAuth() {
        const res = await fetch(`${APP_CONFIG.API_URL}/auth/refresh`, {
          method: "POST",
          credentials: "include",
        });

        if (!res.ok) {
          window.location.href = "/";
          return;
        }

        localStorage.setItem('accessToken', (await res.json()).accessToken);

        document.getElementById('container').style.display = "block";
        document.getElementById('app-loader').style.display = "none";
      }

      async function loadDashboardData(token) {
        const res = await fetch(`${APP_CONFIG.API_URL}auth/@me`, {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });
      }
    </script>
  </body>
</html>
