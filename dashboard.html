<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої резюме</title>

    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/dashboard.css" />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <script defer src="/assets/js/config.js"></script>
    <script defer src="/assets/js/main.js"></script>
    <script defer src="/assets/js/dashboard.js" defer></script>
  </head>
  <body>
    <!--# include virtual="/parts/menu/menu.html"-->

    <!-- include virtual="/parts/preloader/preloader.html"-->

    <main class="dashboard-main container">
      <section class="dashboard-section">
        <div class="section-title-group">
          <div class="hero-badge">⚡ В процесі</div>
          <h2>Драфти та чернетки</h2>
        </div>

        <div class="resume-grid" id="draft-container">
          <a href="#" class="resume-create-card">
            <i class="fa-solid fa-plus"></i>
            <h3>Створити нове CV</h3>
          </a>
        </div>
      </section>

      <section class="dashboard-section">
        <div class="section-title-group">
          <div class="hero-badge">🚀 Готові до роботи</div>
          <h2>Мої опубліковані резюме</h2>
        </div>
        <div class="resume-grid" id="published-container">
          <div class="resume-card skeleton-card">
            <div class="skeleton-line title"></div>
            <div class="skeleton-line subtitle"></div>
            <div class="skeleton-line body"></div>
            <div class="skeleton-actions"></div>
          </div>
        </div>
      </section>
    </main>

    <!--# include virtual="/parts/footer/footer.html"-->

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const telegramLinks = document.querySelectorAll(".telegram-link");
        telegramLinks.forEach((link) => (link.href = APP_CONFIG.TELEGRAM_BOT));

        // await getCvs();
      });

      document
        .getElementById("logout-btn")
        ?.addEventListener("click", async () => {
          logout();
        });
    </script>
  </body>
</html>
