<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мої резюме</title>

    <link rel="stylesheet" href="/assets/css/main.css" />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <script defer src="/assets/js/config.js"></script>
    <script defer src="/assets/js/main.js"></script>
    <script defer src="/assets/js/dashboard.js" defer></script>
  </head>
  <body>
    <!--# include virtual="/parts/menu/menu.html"-->

    <!-- include virtual="/parts/preloader/preloader.html"-->

    <div class="container" id="container">
      <!-- ========================= -->
      <!-- МОЇ РЕЗЮМЕ -->
      <!-- ========================= -->

      <section class="resume-section">
        <div class="section-header">
          <h2>Мої резюме</h2>
        </div>

        <div class="resume-grid" id="resume-container">
          <a
            class="resume-create telegram-link"
            href="https://t.me/SimpleCVLife_bot"
            target="_blank"
          >
            <i class="fa-solid fa-plus"></i>
            <h3>Створити нове резюме</h3>
          </a>
        </div>
      </section>
    </div>

    <div id="resume-modal" class="modal hidden">
      <div class="modal-overlay"></div>

      <div class="modal-content">
        <span class="modal-close">&times;</span>

        <img id="modal-image" src="" alt="Resume" />

        <div class="modal-letter">
          <h3>Супровідний лист</h3>
          <p id="modal-text"></p>
        </div>
      </div>
    </div>

    <!--# include virtual="/parts/footer/footer.html"-->

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const telegramLinks = document.querySelectorAll(".telegram-link");
        telegramLinks.forEach((link) => (link.href = APP_CONFIG.TELEGRAM_BOT));

        // await getCvs();
      });

      document
        .getElementById("logout-btn")
        ?.addEventListener("click", async () => {
          logout();
        });
    </script>
  </body>
</html>
