<link rel="stylesheet" href="/parts/alert-handler/alert-handler.css" />

<div class="alert-toast" id="alertToast">
  <div class="alert-toast__icon">
    <i class="fa-solid fa-circle-exclamation"></i>
  </div>

  <div class="alert-toast__content">
    <div class="alert-toast__title"></div>
    <div class="alert-toast__message"></div>
  </div>

  <button class="alert-toast__close" type="button">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <div class="alert-toast__progress"></div>
</div>

<script src="/parts/alert-handler/alert-handler.js"></script>
