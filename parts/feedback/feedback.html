<link rel="stylesheet" href="/parts/feedback/feedback.css" />

<div class="feedback-section hidden">
  <h3>Зворотній зв’язок</h3>

  <input
    class="feedback-email"
    type="email"
    name="email"
    placeholder="Ваш email"
    required
  />
  <textarea
    class="feedback-text"
    placeholder="Напишіть коментар або питання..."
    name="message"
    required
  ></textarea>

  <button class="btn btn-primary send-feedback">Надіслати</button>

  <p class="feedback-status" class="feedback-status"></p>
</div>

<script src="/parts/feedback/feedback.js"></script>
