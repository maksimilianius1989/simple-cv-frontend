<link href="modal-draft.css" rel="stylesheet" />

<div class="modal-overlay" id="create-draft-modal">
  <div class="modal-card">
    <button
      class="modal-close-btn"
      id="draft-close-modal-btn"
      aria-lable="Закрити"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>

    <div class="modal-header">
      <div class="hero-badge">✨ AI Generator</div>
      <h2 class="modal-title">Створення драфту резюме</h2>
      <p class="modal-subtitle">
        Опишіть свій досвід у довільній формі, а наш AI-асистент структурує його
        у професійне CV.
      </p>
    </div>

    <form class="modal-form" id="create-draft-form">
      <div class="form-group">
        <lable for="bio-description" class="form-label">
          <i class="fa-solid fa-aligh-left"></i> Опис вашого досвіду та
          біографії
        </lable>
        <textarea
          name="description"
          id="bio-description"
          class="form-textarea"
          rows="6"
          placeholder="Наприклад: Працюю Node.js розробником 3 роки, маю досвід з NestJS, PostgreSQL та Docker. Також керував командою з 3 людей..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <lable class="form-lable"
          ><i class="fa-solid fa-image"></i> Фотографія для
          резюме(необов'язково)
        </lable>

        <div class="file-upload-wrapper" id="draft-drop-zone">
          <input
            type="file"
            id="draft-photo-upload"
            name="photo"
            accept="image/*"
            class="file-input"
          />
          <div class="file-upload-content">
            <div class="upload-icon-box">
              <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <div class="upload-text">
              <span class="upload-primary-text"
                >Натисніть або перетягніть фото сюди</span
              >
              <span class="upload-secondary-text"
                >PNG, JPG або WEBP (макс. 5MB)</span
              >
            </div>
          </div>

          <div class="file-preview-info hidden" id="file-preview">
            <i class="fa-solid fa-file-image"></i>
            <span id="draft-file-name-text">photo.jpg</span>
            <button
              class="btn-remove-file"
              type="button"
              id="draft-remove-file-btn"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-rimary btn-generate" type="submit">
          <i class="fa-solid fa-wand-magic-sparkles"></i> Згенерувати драфт
        </button>
      </div>
    </form>
  </div>
</div>
