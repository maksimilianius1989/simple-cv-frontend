<link rel="stylesheet" href="/parts/header/header.css" />

<header class="header header-scope">
  <div class="container header-wrapper">
    <a href="/" class="logo">Simple CV Life</a>

    <div class="header-actions">
      <button
        type="button"
        class="coffee-donate-btn btn-secondary"
        id="buy-coffee-btn"
        data-amount="100"
      >
        <i class="fa-solid fa-mug-hot"></i>
        <span>Купити каву (подякувати)</span>
      </button>

      <div id="auth-guest" class="auth-group">
        <a href="#" class="btn-primary" id="login-trigger">Увійти</a>

        <div class="auth-dropdown" id="login-dropdown">
          <a href="#" id="google-btn" class="btn-secondary">Google</a>

          <div id="telegram-widget-container">
            <script
              async
              src="https://telegram.org/js/telegram-widget.js?22"
              data-telegram-login="itvimax_SCV_test_bot"
              data-size="large"
              data-radius="10"
              data-onauth="onTelegramAuth(user)"
              data-request-access="write"
            ></script>
          </div>
        </div>
      </div>

      <div id="auth-user" class="auth-group is-hidden">
        <a class="btn-secondary" href="/dashboard.html">Кабінет</a>
        <button id="logout-btn" class="btn-danger">
          <i class="fa-solid fa-right-from-bracket"></i>
          Вийти
        </button>
      </div>
    </div>
  </div>
</header>

<script
  id="widget-wfp-script"
  src="https://secure.wayforpay.com/server/pay-widget.js"
></script>
<script src="/parts/header/header.js"></script>
