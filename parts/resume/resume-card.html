<link rel="stylesheet" href="/parts/resume/resume-card.css" />

<template id="resume-card-template">
  <div class="resume-card resume-card-scope resume is-generationg">
    <div class="resume-card-header">
      <div class="card-top-badges">
        <span class="hero-badge badge-status"></span>
        <span class="hero-badge cv-status"
          ><i class="fa-solid fa-pen-to-square"></i
        ></span>
      </div>
      <h3 class="card-title"></h3>
      <p class="resume-card-date card-position"></p>
      <span class="hero-badge badge-views"></span>
    </div>

    <img
      class="preview-thumbnail"
      src="/assets/img/cv-skeleton.png"
      alt="Preview thumbnail"
    />

    <div class="resume-sub-info">
      <div class="publication-info hidden">
      </div>
    </div>

    <div class="resume-actions">
      <a   
        target="_blank"
        class="action-icon action-view hidden"
        title="Переглянути"
      >
        <i class="fa-solid fa-eye"></i>
      </a>
      <a
        target="_blank"
        class="action-icon action-pdf hidden"
        title="Завантажити PDF"
      >
        <i class="fa-solid fa-file-pdf"></i>
      </a>
      <a class="action-icon action-copy hidden" title="Скопіювати посилання">
        <i class="fa-solid fa-link"></i>
      </a>

      <a
        class="action-icon action-toggle-publish"
        title="Зняти з публікації"
      >
        <i class="fa-solid fa-toggle-on"></i>
      </a>

      <a class="action-icon action-delete" title="Видалити">
        <i class="fa-solid fa-trash-can"></i>
      </a>
    </div>
  </div>
</template>

<script src="/parts/resume/resume-card.js"></script>
