<link rel="stylesheet" href="draft-form.css" />

<template id="draft-form-template" display="none">
  <div>
    <form action="" class="draft-form">
      <div class="bio-form-group" id="bioGroup">
        <label class="form-label" for="bioTextarea">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          Опис або ключові навички
        </label>

        <textarea
          id="bioTextarea"
          class="form-textarea"
          placeholder="Введіть короткий опис про себе, досвід роботі або стек технологій..."
        ></textarea>

        <div class="error-message">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Будь ласка, введіть опис або завантажте файл</span>
        </div>
      </div>

      <!-- Drag and Drop Завантаження файлу -->
      <div class="file-upload-wrapper" id="dropZone">
        <input
          type="file"
          id="fileInput"
          class="file-input"
          accept=".pdf,.doc,.docx,.txt"
        />

        <div class="upload-icon-box">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>

        <div class="upload-text">
          <span class="upload-primary-text"
            >Натисніть або перетягніть файл сюди</span
          >
          <span class="upload-secondary-text"
            >Підтримуються PDF, DOCX, TXT (макс. 10MB)</span
          >
        </div>
      </div>

      <!-- Прев'ю вибраного файлу -->
      <div class="file-preview-info hidden" id="filePreview">
        <div style="display: flex; align-items: center; gap: 8px">
          <i class="fa-solid fa-file-lines" style="color: var(--pink)"></i>
          <span id="fileName">resume.pdf</span>
        </div>

        <button
          type="button"
          id="removeFileBtn"
          style="
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
          "
          title="Видалити файл"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Кнопка генерації -->
      <button type="button" id="btnGenerate" class="btn-generate">
        <i class="fa-solid fa-bolt"></i>
        <span>Згенерувати</span>
      </button>
    </form>
  </div>
</template>

<script src="draft-form.js"></script>
