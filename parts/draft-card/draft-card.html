<link rel="stylesheet" href="/parts/draft-card/draft-card.css" />

<template id="draft-card-template">
  <div class="resume-card draft draft-card-scope">
    <div class="resume-card-header">
      <div class="draft-status">
        <i class="fa-solid fa-pen-to-square"></i>
      </div>
      <h3></h3>
      <p class="resume-card-date"></p>
    </div>

    <img class="preview-thumbnail" src="/assets/img/cv-skeleton.png" alt="Preview thumbnail">

    <p class="resume-card-description"></p>

    <div class="resume-actions">
      <a href="#" class="action-icon delete" title="Видалити">
        <i class="fa-solid fa-trash-can"></i>
      </a>
    </div>
  </div>
</template>

<script src="/parts/draft-card/draft-card.js"></script>
