<link rel="stylesheet" href="/parts/draft/draft-card.css" />

<template id="draft-card-template">
  <div class="resume-card is-generationg draft">
    <div class="resume-card-header">
      <div class="draft-status">
        <i class="fa-solid fa-pen-to-square"></i>
      </div>
      <h3></h3>
      <p class="resume-card-date"></p>
    </div>

    <img
      class="preview-thumbnail"
      src="/assets/img/cv-skeleton.png"
      alt="Preview thumbnail"
    />

    <p class="resume-card-description"></p>

    <div class="resume-actions">
      <a class="action-icon draft-clone hidden" title="Створити резюме">
        <i class="fa-solid fa-clone"></i>
      </a>
      <a
        class="action-icon btn-pdf hidden"
        target="_blank"
      >
        <i class="fa-solid fa-file-pdf"></i>
      </a>
      <a href="#" class="action-icon action-delete" title="Видалити">
        <i class="fa-solid fa-trash-can"></i>
      </a>
    </div>
  </div>
</template>

<script src="/parts/draft/draft-card.js"></script>
