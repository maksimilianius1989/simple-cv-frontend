<link rel="stylesheet" href="/parts/draft/draft-form.css" />

<template id="draft-form-template">
  <section class="draft-form-scope">
    <form method="post" class="draft-form">
      <div class="prompt-form-group">
        <label class="form-label" for="promptTextarea">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          Опис або ключові навички
        </label>

        <textarea
          name="prompt"
          class="form-textarea"
          placeholder="Введіть короткий опис про себе, досвід роботі або стек технологій..."
        ></textarea>

        <div class="error-message">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>Будь ласка, введіть опис</span>
        </div>
      </div>

      <div class="file-upload-wrapper">
        <input
          type="file"
          name="file"
          class="file-input"
          accept=".jpeg,.jpg,.pdf,"
        />

        <div class="upload-icon-box">
          <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>

        <div class="upload-text">
          <span class="upload-primary-text"
            >Натисніть або перетягніть фото сюди</span
          >
          <span class="upload-secondary-text"
            >Підтримуються JPEG, JPG, PNG (макс. 5MB)</span
          >
        </div>
      </div>

      <div class="file-preview-info hidden">
        <div style="display: flex; align-items: center; gap: 8px">
          <i class="fa-solid fa-file-lines" style="color: var(--pink)"></i>
          <span>avatar.png</span>
        </div>

        <button
          type="button"
          style="
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 4px;
          "
          title="Видалити файл"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <button type="submit" class="btn-generate">
        <i class="fa-solid fa-bolt"></i>
        <span>Згенерувати</span>
      </button>
    </form>

    <a href="/create.html" class="btn-create-manually">
      <span class="btn-main-content">
        <i class="fa-solid fa-pen-to-square"></i>
        <span>Створити вручну</span>
      </span>
      
      <i class="fa-solid fa-arrow-right btn-arrow"></i>
    </a>
  </section>
</template>

<script src="/parts/draft/draft-form.js"></script>
